name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q uk_hunter
      - name: Public release hygiene
        run: python scripts/check_public_release.py
      - name: Verify generic public profile only
        run: |
          test -f config/profile.example.json
          test ! -e config/search_profile.json
          test ! -e local_config/search_profile.json
